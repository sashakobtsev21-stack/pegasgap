# Матрица регулярного обхода.
#
# Окна дат задаются смещением от дня запуска, а не абсолютными датами — иначе конфиг
# протухнет и обход начнёт искать туры в прошлом.
#
# Сколько это работает: один сценарий — это два браузерных поиска примерно по полторы
# минуты. Число сценариев = города × страны × режимы × окна. Ниже 1 × 3 × 2 × 2 = 12
# сценариев, то есть порядка 20 минут при `--jobs 2`. Расширять охват имеет смысл после
# того, как первые прогоны покажут, что находки осмысленные.

operator: Pegas Touristik

defaults:
  departure_cities:
    - Москва
  adults: 2
  nights_min: 7
  nights_max: 7
  modes:
    - tours    # с перелётом
    - hotels   # без перелёта, только проживание

# Топ-направления оператора. Начинаем узко и осознанно.
countries:
  - Турция
  - Египет
  - ОАЭ

windows:
  - offset_days: 14   # ближняя глубина продаж
    length_days: 7
  - offset_days: 45   # средняя
    length_days: 7
