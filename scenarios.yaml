# Матрица регулярного обхода.
#
# Список направлений получен командой `pegasgap top` — она меряет, где у оператора
# реально есть предложения. Числа в комментариях — объём на момент замера (август 2026),
# они справочные: перезапустите top, если состав вызывает сомнения.
#
# Окна дат задаются смещением от дня запуска, а не абсолютными датами — иначе конфиг
# протухнет и обход начнёт искать туры в прошлом.
#
# Город вылета пока только московский: шлюз Слетать не применяет cityFromId и на любой
# другой город вернул бы московскую выдачу. Подробности — в README, раздел
# «Какие направления мониторить».

operator: Pegas Touristik

defaults:
  adults: 2
  nights_min: 7
  nights_max: 7
  modes:
    - tours    # с перелётом
    - hotels   # без перелёта, только проживание

routes:
  # Только направления, где оператор есть НА ОБЕИХ сторонах. Список выдаёт
  # `pegasgap top`: он же отсеивает те, где сравнивать не с чем. Из девятнадцати
  # направлений, где у оператора есть предложения у нас, на витрине Турвизора он
  # присутствует лишь на семи — ОАЭ, Таиланд, Кипр и другие туда просто не поставляются
  # через эту площадку, и мониторить их нечем.
  - {from: Москва, country: Россия}     # предложений у оператора: 9443
  - {from: Москва, country: Турция}     # 4003
  - {from: Москва, country: Вьетнам}    # 3177
  - {from: Москва, country: Египет}     # 1903
  - {from: Москва, country: Грузия}     # 803
  - {from: Москва, country: Абхазия}    # 623
  - {from: Москва, country: Тунис}      # 175

windows:
  - offset_days: 14   # ближняя глубина продаж
    length_days: 7
  - offset_days: 45   # средняя
    length_days: 7
