# Матрица регулярного обхода.
#
# Размер матрицы — произведение измерений, и его полезно уметь считать в уме:
#
#   операторы × города × страны × режимы × окна × длительности × составы
#
# Режим «отели» города вылета не имеет (это проживание без перелёта), поэтому по нему
# город схлопывается в первый из списка — иначе десять городов дали бы десять
# одинаковых поисков. Итог считает `pegasgap sweep --dry-run`.
#
# Окна дат задаются смещением от дня запуска, а не абсолютными датами — иначе конфиг
# протухнет и обход начнёт искать туры в прошлом.

operators:
  - Pegas Touristik
  - Coral Travel
  - Sunmar

defaults:
  modes:
    - tours    # с перелётом
    - hotels   # без перелёта, только проживание

  # Города вылета. Проверено, что все десять есть в справочниках ОБЕИХ площадок:
  # Турвизор пишет часть из них сокращённо («С.Петербург»), это разбирается алиасами
  # в провайдере. Ростова-на-Дону у Турвизора нет вовсе, поэтому его тут нет.
  departure_cities:
    - Москва
    - Санкт-Петербург
    - Екатеринбург
    - Новосибирск
    - Казань
    - Самара
    - Уфа
    - Краснодар
    - Красноярск
    - Пермь

  # Длительности. Оператор часто отваливается не «по стране», а на конкретной
  # длительности: неделя есть, десять ночей уже нет.
  nights:
    - 7
    - 10

  pax:
    - {adults: 2}

# Страны. Перечислены списком, а не парами `routes`: города перемножаются на страны,
# потому что покрытие нужно именно по всем городам.
#
# Состав подобран под троих операторов сразу — это классическая турецко-египетская
# тройка с азиатским и карибским плечом. Где у оператора на витрине пусто, прогон
# честно скажет «сравнивать не с чем» и находок не даст; такие пары видно в истории,
# и их стоит убирать отсюда руками, а не гадать заранее.
countries:
  - Турция
  - Египет
  - ОАЭ
  - Таиланд
  - Вьетнам
  - Россия
  - Абхазия
  - Грузия
  - Мальдивы
  - Шри-Ланка

# Глубина продаж. Пропуски у оператора обычно привязаны именно к ней: ближние даты
# распроданы, дальние ещё не открыты в продажу, и интересна как раз середина.
windows:
  - {offset_days: 14, length_days: 7}   # ближняя
  - {offset_days: 30, length_days: 7}
  - {offset_days: 45, length_days: 7}   # средняя
  - {offset_days: 60, length_days: 7}
  - {offset_days: 90, length_days: 7}   # дальняя
  - {offset_days: 120, length_days: 7}
